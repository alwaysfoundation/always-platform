name: always-ai-release
# Publishes @alwaysfoundation/always-ai to npm when a tag like ai-v0.1.0 is pushed.
# Needs the NPM_TOKEN secret (an automation token for the alwaysfoundation npm org).
on:
  push:
    tags: ['ai-v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - name: Tag matches package version
        run: test "ai-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
