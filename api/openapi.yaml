openapi: 3.1.0
info:
  title: Always API
  version: 0.2.0
  summary: Consent-first handoff from a response to the next best faith step, for Australia.
  license: { name: Apache-2.0, identifier: Apache-2.0 }
  description: |
    The Always API lets senders (events, tours, ministries, apps) pass a consenting person to the
    network, lets receiving churches and ministries accept or pass introductions, and lets anyone read
    the public directory. All personal data is processed and stored in Australia.

    Authentication:
    - Sender and integration tokens: `Authorization: Bearer alw_live_...` (scoped, revocable, shown once).
    - Staff: Supabase Auth JWT plus `X-Always-Org: <organisation id>`.
    Webhooks are CloudEvents 1.0 signed with `always-signature: v1=<hmac-sha256(timestamp.body)>`.
servers:
  - url: https://api.alwaysfoundation.org
  - url: https://api.staging.alwaysfoundation.org
security:
  - bearer: []
tags:
  - name: Directory
  - name: Responses
  - name: Inbox
  - name: Profile
  - name: Person
  - name: Operations
  - name: Compliance
  - name: Webhooks
paths:
  /v1/feed/churches:
    get:
      tags: [Church feed]
      security: []
      summary: Churches near a place, from the opt-in church feed (no personal data)
      parameters:
        - { name: postcode, in: query, schema: { type: string, pattern: '^\d{4}$' } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
        - { name: radiusKm, in: query, schema: { type: number, default: 25, maximum: 200 } }
        - { name: step, in: query, schema: { type: string, enum: [church, explore, talk, youth, group, help, read] } }
        - { name: welcoming, in: query, schema: { type: boolean } }
        - { name: youth, in: query, schema: { type: boolean } }
        - { name: state, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: x-always-key, in: header, required: false, schema: { type: string }, description: Optional developer key }
      responses:
        '200': { description: Churches, nearest first }
        '401': { description: The developer key sent is not valid }
  /v1/feed/churches.jsonl:
    get:
      tags: [Church feed]
      security: []
      summary: The whole church feed as JSON Lines, refreshed hourly
      responses:
        '200': { description: One church per line, content: { application/x-ndjson: {} } }
  /v1/verify/{slug}:
    get:
      tags: [Verification]
      security: []
      summary: Whether a church is verified, a verified youth partner, and welcoming now
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Verification status }
        '404': { description: No such church }
  /v1/org/feed:
    put:
      tags: [Church feed]
      summary: A church opts in to, or out of, the church feed
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [optIn], properties: { optIn: { type: boolean } } } } } }
      responses:
        '200': { description: Current opt-in }
  /mcp:
    post:
      tags: [AI]
      security: []
      summary: Always MCP server (Streamable HTTP, read-only, no personal data)
      responses:
        '200': { description: JSON-RPC response }
        '202': { description: Notification accepted }
  /v1/compliance/register:
    get:
      tags: [Compliance]
      security: []
      summary: The latest published compliance register (open data, CC BY 4.0). CORS open; send If-None-Match with the ETag.
      responses: { '200': { description: Register }, '304': { description: Not modified } }
  /v1/compliance/register/versions:
    get:
      tags: [Compliance]
      security: []
      summary: Every published register version, newest first
      responses: { '200': { description: Versions } }
  /v1/compliance/register/{version}:
    get:
      tags: [Compliance]
      security: []
      summary: One published register version. Immutable.
      parameters: [{ name: version, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Register }, '404': { description: Not found } }
  /v1/compliance/changes:
    get:
      tags: [Compliance]
      security: []
      summary: What changed between published register versions, newest first
      responses: { '200': { description: Change feed } }
  /v1/compliance/check:
    post:
      tags: [Compliance]
      security: []
      summary: A free check-up. Nothing is stored.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [profile], properties: { profile: { $ref: '#/components/schemas/ComplianceProfile' }, answers: { type: object, additionalProperties: { enum: [yes, no, unsure, not_applicable] } } } } } } }
      responses: { '200': { description: Assessment }, '422': { description: Invalid body } }
  /v1/webhooks:
    get: { tags: [Webhooks], summary: Your webhook endpoints (admin or webhooks scope). Secrets are never returned., responses: { '200': { description: Endpoints } } }
    post:
      tags: [Webhooks]
      summary: Add an endpoint. Returns the signing secret once. Public https hosts only, ten at most.
      description: Deliveries are CloudEvents 1.0, signed with HMAC-SHA256 (always-timestamp, always-signature). Compliance events are always.compliance.register.published and always.compliance.obligations.affected; their data carries register facts, never people.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [url, events], properties: { url: { type: string, format: uri }, events: { type: array, items: { type: string, example: always.compliance.obligations.affected } } } } } } }
      responses: { '201': { description: Created, with secret }, '409': { description: Too many endpoints }, '422': { description: Invalid body } }
  /v1/webhooks/{id}:
    delete:
      tags: [Webhooks]
      summary: Remove an endpoint
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Removed }, '404': { description: Not found } }
  /v1/compliance/profile:
    get: { tags: [Compliance], summary: Your organisation's profile and answers (admin or compliance scope), responses: { '200': { description: Profile and answers } } }
    put:
      tags: [Compliance]
      summary: Save your organisation's profile
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceProfile' } } } }
      responses: { '200': { description: Saved } }
  /v1/compliance/answers:
    put:
      tags: [Compliance]
      summary: Save answers to evidence questions
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { answers: { type: array, items: { type: object, required: [evidenceId, answer], properties: { evidenceId: { type: string }, answer: { enum: [yes, no, unsure, not_applicable] }, note: { type: string, maxLength: 1000 } } } } } } } } }
      responses: { '200': { description: Saved }, '422': { description: Unknown evidence } }
  /v1/compliance/assessment:
    get: { tags: [Compliance], summary: Your live assessment, responses: { '200': { description: Assessment }, '409': { description: Profile needed } } }
  /v1/compliance/assessments:
    get: { tags: [Compliance], summary: Your quarterly assessments, responses: { '200': { description: List } } }
  /v1/compliance/assessments/{id}:
    get:
      tags: [Compliance]
      summary: One quarterly assessment
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Assessment }, '404': { description: Not found } }
  /v1/compliance/assessments/{id}/approve:
    post:
      tags: [Compliance]
      summary: Approve the quarterly assessment (a signed-in person only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Approved }, '403': { description: A person must approve }, '404': { description: Not found or already approved } }
  /v1/directory:
    get:
      tags: [Directory]
      security: []
      summary: Search churches and ministries
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/State' } }
        - { name: kind, in: query, schema: { enum: [church, ministry] } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200': { description: Listings, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Listing' } } } } } } }
  /v1/directory/tally:
    get:
      tags: [Directory]
      security: []
      summary: Counts by state and kind (no personal data)
      responses: { '200': { description: Tally } }
  /v1/orgs/{slug}:
    get:
      tags: [Directory]
      security: []
      summary: A church or ministry's public page
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Page }, '404': { description: Not found } }
  /v1/orgs/{id}/claims:
    post:
      tags: [Directory]
      security: []
      summary: Ask to manage a listing
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, role], properties: { email: { type: string, format: email }, role: { type: string }, evidence: { type: string } } } } } }
      responses: { '202': { description: Pending review } }
  /v1/responses:
    post:
      tags: [Responses]
      summary: Pass a consenting person to the network
      description: Requires scope `responses:write`. Minors rules run first; under-13s need a parent and carry no child data.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewResponse' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { responseId: { type: string }, handoffId: { type: string }, state: { $ref: '#/components/schemas/HandoffState' } } } } } }
        '422': { description: Validation or minors rule failed }
  /v1/inbox:
    get:
      tags: [Inbox]
      summary: Introductions offered to or accepted by this organisation
      description: Contact details appear only after acceptance.
      responses: { '200': { description: Items } }
  /v1/handoffs/{id}/accept:
    post: { tags: [Inbox], summary: Accept an introduction, parameters: [{ $ref: '#/components/parameters/HandoffId' }], responses: { '200': { description: Accepted }, '409': { description: No pending offer for this organisation, or expired } } }
  /v1/handoffs/{id}/pass:
    post:
      tags: [Inbox]
      summary: Pass, so the next suitable church is offered
      parameters: [{ $ref: '#/components/parameters/HandoffId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { enum: [capacity, language, fit, safeguarding, other] } } } } } }
      responses: { '200': { description: Passed } }
  /v1/handoffs/{id}/contacted:
    post: { tags: [Inbox], summary: Record first contact, parameters: [{ $ref: '#/components/parameters/HandoffId' }], responses: { '200': { description: Recorded } } }
  /v1/handoffs/{id}/activity:
    post:
      tags: [Inbox]
      summary: Log a call, text, meeting or note (Always hosts no chat)
      parameters: [{ $ref: '#/components/parameters/HandoffId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kind], properties: { kind: { enum: [call, message, text, met, note, reply_received] }, note: { type: string, maxLength: 1000 } } } } } }
      responses: { '201': { description: Logged } }
  /v1/org/profile:
    get: { tags: [Profile], summary: This organisation's profile, offers and capacity, responses: { '200': { description: Profile } } }
    put:
      tags: [Profile]
      summary: Update the public page, next steps offered and capacity
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileUpdate' } } } }
      responses: { '200': { description: Saved } }
  /v1/me/{token}:
    get: { tags: [Person], security: [], summary: The person's status and which church will contact them, parameters: [{ $ref: '#/components/parameters/PersonToken' }], responses: { '200': { description: Status } } }
  /v1/me/{token}/withdraw:
    post: { tags: [Person], security: [], summary: Change my mind; details deleted within 7 days, parameters: [{ $ref: '#/components/parameters/PersonToken' }], responses: { '200': { description: Withdrawn } } }
  /v1/me/{token}/connected:
    post: { tags: [Person], security: [], summary: I'm connected (the only thing that counts as connected), parameters: [{ $ref: '#/components/parameters/PersonToken' }], responses: { '200': { description: Closed } } }
  /v1/parent/{token}/confirm:
    post: { tags: [Person], security: [], summary: A parent or guardian confirms (13 to 14 year olds), parameters: [{ $ref: '#/components/parameters/PersonToken' }], responses: { '200': { description: Routing started } } }
  /v1/ops/orgs/{id}/verify:
    post: { tags: [Operations], summary: Verify a church (care team only), parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Verified } } }
  /v1/ops/tokens:
    post: { tags: [Operations], summary: Issue a scoped API token (care team only), responses: { '201': { description: Token shown once } } }
webhooks:
  always.offer.created: { post: { summary: An introduction was offered to your organisation, requestBody: { content: { application/cloudevents+json: { schema: { $ref: '#/components/schemas/Event' } } } }, responses: { '200': { description: OK } } } }
  always.handoff.accepted: { post: { summary: A church accepted (sent to the sender if notify.sender was agreed), requestBody: { content: { application/cloudevents+json: { schema: { $ref: '#/components/schemas/Event' } } } }, responses: { '200': { description: OK } } } }
  always.handoff.withdrawn: { post: { summary: The person withdrew; delete what you hold, requestBody: { content: { application/cloudevents+json: { schema: { $ref: '#/components/schemas/Event' } } } }, responses: { '200': { description: OK } } } }
  /v1/events:
    get:
      tags: [Events]
      security: []
      summary: Upcoming Christian events across Australia
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [NSW, VIC, QLD, WA, SA, TAS, ACT, NT] } }
        - { name: kind, in: query, schema: { type: string, enum: [worship, music, outreach, conference, youth, course, prayer, training, other] } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses: { '200': { description: Published, upcoming events } }
  /v1/org/events:
    post:
      tags: [Events]
      summary: Add your church or ministry's event
      description: Requires scope `events`. Verified partners publish straight away; others are checked first.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewEvent' } } } }
      responses: { '201': { description: Created }, '422': { description: Validation failed } }
  /v1/events/suggest:
    post:
      tags: [Events]
      security: []
      summary: Suggest an event (checked before it shows)
      description: Needs `humanToken` from the invisible human check (Cloudflare Turnstile).
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/NewEvent' }, { type: object, properties: { humanToken: { type: string } } }] } } } }
      responses: { '202': { description: Pending review }, '403': { description: Human check failed } }
  /v1/pages/{slug}:
    get:
      tags: [Response pages]
      security: []
      summary: A hosted response page (for a video, social post, event or printed card)
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Page }, '404': { description: Not found } }
  /v1/pages/{slug}/respond:
    post:
      tags: [Response pages]
      security: []
      summary: Respond on a hosted page
      description: Needs `humanToken` from the invisible human check. The same consent and minors rules as every response apply.
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/NewResponse' }, { type: object, properties: { humanToken: { type: string } } }] } } } }
      responses: { '201': { description: Created }, '403': { description: Human check failed }, '422': { description: Validation, minors rule or step not offered } }
  /v1/feedback:
    post:
      tags: [Feedback]
      security: []
      summary: Share an idea, report a problem or suggest a missing church
      description: Needs `humanToken` from the invisible human check. Email is optional and encrypted.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kind, area, message], properties: { kind: { type: string, enum: [idea, bug, missing] }, area: { type: string }, message: { type: string, maxLength: 4000 }, email: { type: string, format: email }, humanToken: { type: string } } } } } }
      responses: { '202': { description: Received }, '403': { description: Human check failed } }
  /v1/ops/queue:
    get:
      tags: [Foundation team]
      summary: What needs a person today (claims, events, feedback, care team, contact not yet logged)
      responses: { '200': { description: Counts }, '403': { description: Foundation team only } }
  /v1/ops/claims:
    get:
      tags: [Foundation team]
      summary: Pending church claims
      responses: { '200': { description: Claims }, '403': { description: Foundation team only } }
  /v1/ops/claims/{id}/decide:
    post:
      tags: [Foundation team]
      summary: Approve or decline a church claim
      description: Approving makes the requester an admin of the church's page and marks it claimed. Verification is a separate step.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [approve, reject] }, note: { type: string, maxLength: 500 } } } } } }
      responses: { '200': { description: Decided }, '409': { description: Already decided } }
  /v1/ops/events:
    get:
      tags: [Foundation team]
      summary: Events waiting to be checked
      responses: { '200': { description: Events } }
  /v1/ops/events/{id}/decide:
    post:
      tags: [Foundation team]
      summary: Publish or hide a suggested event
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [publish, hide] } } } } } }
      responses: { '200': { description: Decided }, '404': { description: Not found or already decided } }
  /v1/ops/feedback:
    get:
      tags: [Foundation team]
      summary: New ideas, problems and missing churches
      responses: { '200': { description: Feedback } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    HandoffId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    PersonToken: { name: token, in: path, required: true, schema: { type: string } }
  schemas:
    ComplianceProfile:
      type: object
      required: [states, collectsPersonalInfo, turnoverOver3m, providesHealthService, usesOverseasServices, worksWithChildren, onlineServicesForChildren, sendsEmailOrSms, acncRegistered, basicReligiousCharity, acncMediumOrLarge]
      properties:
        states: { type: array, items: { $ref: '#/components/schemas/State' }, minItems: 1 }
        collectsPersonalInfo: { type: boolean }
        turnoverOver3m: { type: boolean }
        providesHealthService: { type: boolean }
        usesOverseasServices: { type: boolean }
        worksWithChildren: { type: boolean }
        onlineServicesForChildren: { type: boolean }
        sendsEmailOrSms: { type: boolean }
        acncRegistered: { type: boolean }
        basicReligiousCharity: { type: boolean }
        acncMediumOrLarge: { type: boolean }
    NewEvent:
      type: object
      required: [title, startsAt, state]
      properties:
        title: { type: string, minLength: 3, maxLength: 140 }
        kind: { type: string, enum: [worship, music, outreach, conference, youth, course, prayer, training, other] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        venue: { type: string }
        suburb: { type: string }
        state: { type: string, enum: [NSW, VIC, QLD, WA, SA, TAS, ACT, NT] }
        postcode: { type: string, pattern: '^\\d{4}$' }
        url: { type: string, format: uri, pattern: '^https://' }
    State: { enum: [NSW, VIC, QLD, WA, SA, TAS, ACT, NT] }
    AgeBand: { enum: [under13, '13-14', '15-17', '18+'] }
    Step: { enum: [church, explore, talk, youth, group, help, read] }
    HandoffState: { enum: [awaiting_parent, routing, offered, accepted, contacted, care_team, closed, withdrawn] }
    Consent:
      type: object
      required: [purposes, allowNextNearby, wordingVersion, party]
      properties:
        purposes: { type: array, items: { enum: [connect.church, notify.sender, resources, stats.anonymous] }, minItems: 1 }
        recipients: { type: array, items: { type: string, format: uuid } }
        allowNextNearby: { type: boolean }
        wordingVersion: { type: string }
        party: { enum: [self, parent] }
    NewResponse:
      type: object
      required: [contact, suburb, postcode, state, ageBand, step, consent]
      properties:
        firstName: { type: string, maxLength: 60 }
        contact: { type: object, required: [kind, value], properties: { kind: { enum: [mobile, email] }, value: { type: string } } }
        parentContact: { type: object, properties: { kind: { enum: [mobile, email] }, value: { type: string } } }
        suburb: { type: string }
        postcode: { type: string, pattern: '^\d{4}$' }
        state: { $ref: '#/components/schemas/State' }
        ageBand: { $ref: '#/components/schemas/AgeBand' }
        step: { $ref: '#/components/schemas/Step' }
        language: { type: string }
        note: { type: string, maxLength: 500, description: Adults only }
        placementId: { type: string, format: uuid }
        campaignId: { type: string, format: uuid }
        consent: { $ref: '#/components/schemas/Consent' }
    Listing:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        kind: { enum: [church, ministry, network] }
        display_name: { type: string }
        denomination: { type: string }
        trust_level: { enum: [listed, claimed, verified, verified_youth] }
        suburb: { type: string }
        state: { $ref: '#/components/schemas/State' }
        website: { type: string }
    ProfileUpdate:
      type: object
      properties:
        displayName: { type: string }
        welcomeLine: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        website: { type: string, format: uri }
        brandColour: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        pageLayout: { type: object, properties: { style: { enum: [classic, warm, bold] }, sections: { type: array, items: { type: string } } } }
        offers: { type: array, items: { $ref: '#/components/schemas/Step' } }
        capacity: { type: object, properties: { monthlyLimit: { type: integer }, areaRadiusKm: { type: number }, languages: { type: array, items: { type: string } }, pausedUntil: { type: [string, 'null'], format: date-time } } }
    Event:
      type: object
      required: [specversion, id, source, type, time]
      properties:
        specversion: { const: '1.0' }
        id: { type: string }
        source: { type: string }
        type: { type: string }
        time: { type: string, format: date-time }
        data: { type: object, properties: { responseId: { type: string } }, description: Ids only, never personal data }
